<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <title>DORMDESK - One Campus, One Platform</title>
  
  <style>
    .bg { fill: #0d1117; }
    .grid { stroke: #21262d; stroke-width: 1; }
    .border { fill: none; stroke: #30363d; stroke-width: 2; }
    
    .logo-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 800;
      font-size: 80px;
      fill: #c9d1d9;
      letter-spacing: 12px;
    }
    
    .logo-accent {
      fill: #58a6ff;
    }
    
    .subtitle {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #8b949e;
      letter-spacing: 8px;
    }
    
    .bracket {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: 300;
      font-size: 80px;
      fill: #484f58;
    }
    
    .tech-dots { fill: #238636; }
  </style>

  <rect width="800" height="240" rx="8" class="bg"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
  </pattern>
  <rect width="800" height="240" rx="8" fill="url(#grid)"/>

  <!-- Accents -->
  <circle cx="40" cy="40" r="4" class="tech-dots" />
  <circle cx="760" cy="40" r="4" class="tech-dots" />
  <circle cx="40" cy="200" r="4" class="tech-dots" />
  <circle cx="760" cy="200" r="4" class="tech-dots" />

  <path d="M 20 60 L 20 40 L 40 40" fill="none" stroke="#484f58" stroke-width="2" />
  <path d="M 780 60 L 780 40 L 760 40" fill="none" stroke="#484f58" stroke-width="2" />
  <path d="M 20 180 L 20 200 L 40 200" fill="none" stroke="#484f58" stroke-width="2" />
  <path d="M 780 180 L 780 200 L 760 200" fill="none" stroke="#484f58" stroke-width="2" />

  <!-- Main Wordmark -->
  <text x="400" y="130" text-anchor="middle" class="bracket" dx="-250">[</text>
  <!-- Font-Independent SVG Paths for DORMDESK_ -->
  <g id="wordmark">
<path d='M 0,0 H 20 L 30,10 V 40 L 20,50 H 0 Z' transform='translate(185, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 10,0 H 20 L 30,10 V 40 L 20,50 H 10 L 0,40 V 10 Z' transform='translate(235, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 0,50 V 0 H 20 L 30,10 V 20 L 20,30 H 0 M 12,30 L 30,50' transform='translate(285, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 0,50 V 0 L 15,20 L 30,0 V 50' transform='translate(335, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 0,0 H 20 L 30,10 V 40 L 20,50 H 0 Z' transform='translate(385, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 30,0 H 0 V 50 H 30 M 0,25 H 20' transform='translate(435, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 30,10 L 20,0 H 10 L 0,10 L 15,25 L 30,40 L 20,50 H 10 L 0,40' transform='translate(485, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 0,0 V 50 M 30,0 L 0,25 L 30,50' transform='translate(535, 95)' stroke='#c9d1d9' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />
<path d='M 0,50 H 30' transform='translate(585, 95)' stroke='#58a6ff' fill='none' stroke-width='8' stroke-linejoin='miter' stroke-linecap='square' />  </g>
  <text x="400" y="130" text-anchor="middle" class="bracket" dx="250">]</text>

  <!-- Subtitle -->
  <text x="404" y="185" text-anchor="middle" class="subtitle">ONE CAMPUS, ONE PLATFORM</text>
  
  <!-- Frame Border -->
  <rect width="798" height="238" x="1" y="1" rx="8" class="border"/>
</svg>



